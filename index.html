<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NitiSys Project Footprint</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0b1220;
    --panel:#111a2e;
    --panel-2:#17233d;
    --border:#28324d;
    --text:#e8ecf5;
    --text-dim:#93a0bf;
    --text-faint:#5e6a8c;
    --accent:#ff7a29;

    --c-fare:#ff7a29;
    --c-toll:#ffc53d;
    --c-its:#4fd1c5;
    --c-erp:#7c9cff;
    --c-asset:#8bd17c;
    --c-pmcm:#e36bae;
    --c-data:#b48cff;
    --c-plan:#5fb8ff;
    --c-fac:#c9a24b;
    --c-brt:#f43f5e;
    --c-cbtc:#06b6d4;
    --c-tracksafety:#eab308;
    --c-tsmo:#3b82f6;
    --c-zev:#22c55e;
    --c-transitplanning:#a78bfa;
    --c-aviation:#fb923c;
    --c-raileng:#94a3b8;
    --c-gis:#2dd4bf;
    --c-cyber:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  #top-controls{
    position:relative;z-index:1200;flex:none;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  #filter-toggle,#label-toggle{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 14px;border-radius:22px;font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  #filter-toggle:hover,#label-toggle:hover{border-color:var(--text-faint);}
  #filter-toggle.active,#label-toggle.active{background:var(--panel-2);border-color:var(--accent);color:var(--accent);}
  #filter-toggle svg,#label-toggle svg{flex:none;}

  #topbar{position:relative;z-index:1200;flex:none;
    overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
    max-height:340px;transition:max-height .22s ease, opacity .18s ease;opacity:1;}
  #topbar.collapsed{max-height:0;opacity:0;pointer-events:none;}

  header{
    display:flex;align-items:center;flex-wrap:wrap;
    padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border);
    z-index:1200;position:relative;
  }

  #filters{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);
    padding:5px 10px 5px 8px;border-radius:20px;font-size:11.5px;cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;user-select:none;
    white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip:hover{color:var(--text);border-color:var(--text-faint);}
  .chip.active{color:var(--text);background:var(--panel);border-color:currentColor;}
  .chip.reset{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
  .chip.reset:hover{color:var(--text);}

  /* moved off the filter panel entirely and onto the map itself, so it's
     always visible (open or closed) without eating into the chips' row
     width the way it did as a header sibling. */
  #count{
    position:absolute;top:12px;left:12px;z-index:900;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);
    background:rgba(17,26,46,.85);border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;white-space:nowrap;pointer-events:none;
  }

  /* compact strip of currently-active category chips, shown in place of the
     full picker once it's closed -- so the selection is still visible
     without the vertical space the full list needs. */
  #active-filters{
    display:none;flex-wrap:wrap;align-items:center;gap:6px;
    padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--border);
    position:relative;z-index:1100;
  }
  #active-filters .chip{font-size:11px;padding:4px 8px 4px 7px;}
  #active-filters .chip .x{margin-left:3px;opacity:.65;font-size:10px;}
  #active-filters .chip:hover .x{opacity:1;}
  #active-filters .count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--text-faint);white-space:nowrap;margin-left:auto;}

  #map-wrap{flex:1;position:relative;min-height:0;}
  #map{position:absolute;inset:0;background:var(--bg);}

  .leaflet-container{background:var(--bg);font-family:'IBM Plex Sans',sans-serif;}
  .leaflet-tile-pane{
    filter:invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
  }
  .leaflet-control-attribution{background:rgba(11,18,32,.75)!important;color:var(--text-faint)!important;
    font-size:10px!important;}
  .leaflet-control-attribution a{color:var(--text-dim)!important;}
  .leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;
    border-color:var(--border)!important;}
  .leaflet-control-zoom a:hover{background:var(--panel-2)!important;}

  .pin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(11,18,32,.85);
    box-shadow:0 0 0 3px rgba(255,255,255,0.05), 0 2px 8px rgba(0,0,0,.5);}
  .pin.dimmed{opacity:.18;}
  /* filtered-out pins: visible as faded context only -- no hover, no tap */
  .leaflet-marker-icon.pin-off{pointer-events:none!important;cursor:default!important;}
  .pin-tip{
    font-family:'IBM Plex Sans',sans-serif;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .pin-tip .tt-name{font-weight:600;font-size:13px;margin-bottom:2px;}
  .pin-tip .tt-loc{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .pin-tip .tt-tags{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;}
  .tt-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.02em;
    padding:2px 6px;border-radius:4px;color:#0b1220;font-weight:600;}
  .leaflet-tooltip.pin-tip::before{display:none;}
  .spider-label{
    font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;
    background:rgba(11,18,32,.88);color:var(--text);border:1px solid var(--border);
    border-radius:5px;padding:1px 5px;white-space:nowrap;pointer-events:auto;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4);transition:background .12s,border-color .12s,transform .12s;
  }
  .spider-label.spider-label-hover{
    background:var(--panel-2);border-color:var(--text-faint);transform:scale(1.08);
  }
  .leaflet-tooltip.spider-label::before{display:none;}
  .zoom-label{
    font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:600;
    background:rgba(11,18,32,.88);color:var(--text);border:1px solid var(--border);
    border-radius:5px;padding:1px 5px;white-space:nowrap;pointer-events:none;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .leaflet-tooltip.zoom-label::before{display:none;}
  .pin{transition:transform .12s,box-shadow .12s;}
  .pin.pin-hover{
    transform:scale(1.35);
    box-shadow:0 0 0 4px rgba(255,255,255,.25), 0 2px 10px rgba(0,0,0,.6);
  }

  /* detail panel -- centered modal popup */
  #backdrop{
    position:absolute;inset:0;background:rgba(6,10,20,.6);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:999;
  }
  #backdrop.open{opacity:1;pointer-events:auto;}

  #panel{
    position:absolute;top:50%;left:50%;
    width:460px;max-width:92vw;max-height:82vh;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    transform:translate(-50%,-50%) scale(.96);opacity:0;
    transition:transform .2s ease, opacity .2s ease;
    display:flex;flex-direction:column;z-index:1000;pointer-events:none;
    box-shadow:0 24px 64px rgba(0,0,0,.55);
  }
  #panel.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  #panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);position:relative;border-radius:14px 14px 0 0;}
  #panel-close{
    position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);
    cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  #panel-close:hover{color:var(--text);border-color:var(--text-faint);}
  #panel-loc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);
    letter-spacing:.04em;margin-bottom:6px;}
  #panel-name{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px;padding-right:26px;}
  #panel-cats{display:flex;flex-wrap:wrap;gap:6px;}
  .cat-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;
    color:#0b1220;font-weight:600;letter-spacing:.02em;}

  #panel-body{flex:1;overflow-y:auto;padding:16px 22px 28px;}
  #panel-body::-webkit-scrollbar{width:8px;}
  #panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .proj-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);
    margin-bottom:14px;letter-spacing:.03em;}
  .card{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-bottom:12px;
  }
  .card h3{margin:0 0 8px;font-size:14px;font-weight:600;line-height:1.35;}
  .card .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .card .ptag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-dim);
    border:1px solid var(--border);padding:2px 7px;border-radius:4px;}
  .card .ptag-prime{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#94a3b8;
    margin-bottom:8px;}
  .card p{margin:0;font-size:12.5px;line-height:1.55;color:var(--text-dim);}

  #empty-hint{
    position:absolute;left:20px;bottom:18px;z-index:900;
    background:rgba(17,26,46,.9);border:1px solid var(--border);border-radius:8px;
    padding:9px 13px;font-size:11.5px;color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;pointer-events:none;
  }

  @media (max-width:640px){
    /* on narrow screens the two buttons stretch to fill the row and get
       real touch-target height; on wider screens they stay their natural
       inline size within the same in-flow toolbar. */
    #top-controls{justify-content:center;padding:10px 12px;}
    #filter-toggle,#label-toggle{
      flex:1 1 0;justify-content:center;
      padding:11px 12px;min-height:44px;font-size:13px;
    }
    header{padding:12px 14px;gap:10px;}
    #filters{gap:5px;}
    .chip{padding:6px 10px 6px 8px;font-size:11.5px;min-height:30px;}
    #active-filters{padding:7px 14px;}
    #topbar{max-height:58dvh;}
    #panel{width:92vw;max-height:86vh;}
    #panel-close{width:34px;height:34px;font-size:16px;}
    #empty-hint{left:12px;right:12px;bottom:12px;}
  }
</style>
</head>
<body>

</div>

const filtersEl = document.getElementById('filters');
const activeFiltersEl = document.getElementById('active-filters');
const activeCats = new Set();
let topbarOpen = false; // declared this early so renderActiveFilters (called from
                         // applyFilter, further down) can read it safely

function renderChips(){
  filtersEl.innerHTML = '';
  Object.entries(CATS).forEach(([key,c])=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCats.has(key) ? ' active' : '');
    chip.style.color = activeCats.has(key) ? c.hex : '';
    chip.innerHTML = `<span class="dot" style="background:${c.hex}"></span>${c.label}`;
    chip.onclick = () => {
      activeCats.has(key) ? activeCats.delete(key) : activeCats.add(key);
      renderChips();
      applyFilter();
      setTopbarOpen(false); // picking a category closes the full list right
                             // away -- the active pick still shows via the
                             // compact #active-filters strip underneath
    };
    filtersEl.appendChild(chip);
  });
  const reset = document.createElement('div');
  reset.className = 'chip reset';
  reset.textContent = 'RESET';
  reset.onclick = () => { activeCats.clear(); renderChips(); applyFilter(); };
  filtersEl.appendChild(reset);
}
renderChips();

// compact strip of active-category chips shown once the full picker is
// closed, so the current selection stays visible without the vertical
// space the full list needs; empty/topbar-open both mean "show nothing".
function renderActiveFilters(){
  activeFiltersEl.innerHTML = '';
  if (topbarOpen || activeCats.size === 0){
    activeFiltersEl.style.display = 'none';
    return;
  }
  activeFiltersEl.style.display = 'flex';
  activeCats.forEach(key=>{
    const c = CATS[key];
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.style.color = c.hex;
    chip.innerHTML = `<span class="dot" style="background:${c.hex}"></span>${c.label}<span class="x">&#10005;</span>`;
    chip.onclick = () => { activeCats.delete(key); renderChips(); applyFilter(); };
    activeFiltersEl.appendChild(chip);
  });
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = document.getElementById('count').textContent;
  activeFiltersEl.appendChild(count);
}

/* Esri's free hosted basemap tiles -- no API key/account required, and
   (unlike the OSM Foundation's and Wikimedia's tile servers) they don't
   reject requests that arrive with no Referer header, which is exactly
   what happens when this file is opened directly from disk (file://). */
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Basemap &copy; <a href="https://www.esri.com">Esri</a>',
  maxZoom: 16
}).addTo(map);

L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, pane:'overlayPane'
}).addTo(map);

const markers = {};
const AGENCY_BY_ID = {};
AGENCIES.forEach(a=>{ AGENCY_BY_ID[a.id] = a; });

function makeIcon(cats, dimmed, inactive){
  // inactive (default = dimmed): pin ignores all pointer input
  if (inactive === undefined) inactive = dimmed;
  // When one or more filters are active, color the dot by the matching
  // filter category (so an active "ITS" filter shows ITS-teal dots, even
  // for agencies whose *first* listed category is something else).
  // With no filter active, fall back to the agency's first category.
  let colorCat = cats[0];
  if (activeCats.size > 0) {
    const matchedCat = cats.find(c => activeCats.has(c));
    if (matchedCat) colorCat = matchedCat;
  }
  const hex = CATS[colorCat].hex;
  return L.divIcon({
    className: inactive ? 'pin-off' : '',
    html: `<div class="pin${dimmed?' dimmed':''}" style="background:${hex}"></div>`,
    iconSize:[16,16], iconAnchor:[8,8]
  });
}

const tooltipContent = {};
AGENCIES.forEach(a=>{
  const marker = L.marker([a.lat, a.lng], { icon: makeIcon(a.cats,false) }).addTo(map);

  const tagsHtml = a.cats.map(k=>`<span class="tt-tag" style="background:${CATS[k].hex}">${CATS[k].label}</span>`).join('');
  tooltipContent[a.id] =
    `<div class="tt-name">${a.name}</div><div class="tt-loc">${a.city}</div><div class="tt-tags">${tagsHtml}</div>`;
  marker.bindTooltip(tooltipContent[a.id], { direction:'top', offset:[0,-10], className:'pin-tip', opacity:1 });

  marker.on('click', ()=> handleMarkerClick(a));
  markers[a.id] = marker;
});

/* ============================= ALWAYS-ON NAME LABELS PAST A ZOOM LEVEL ============================= */
/* Past a certain zoom, and only where a pin actually has breathing room,
   printing the agency's short name beside its dot (the same look
   spiderfy uses for a fanned-out cluster) reads fine without a hover/tap.
   A single flat zoom threshold doesn't work well here: this dataset has
   tight metro clusters (3 NYC pins a few hundred meters apart) sitting
   alongside pins that are the only agency in their state. So besides a
   minimum zoom, each pin also needs enough on-screen distance to its
   *nearest visible neighbor* -- same idea as the spiderfy overlap check
   below -- or its label would just collide with the next pin's. */
const LABEL_MIN_ZOOM = 4;       // don't bother below state-level zoom
const LABEL_ISOLATION_PX = 25;  // pins closer than this (screen px) are treated as one cluster
const LEADER_GAP_PX = 14;       // horizontal gap from a cluster's rightmost pin to its label stack
const LEADER_LINE_H_PX = 15;    // vertical spacing between stacked labels in a cluster
const zoomLabelsLayer = L.layerGroup().addTo(map);
let currentMatchIds = new Set(AGENCIES.map(a=>a.id));

let panelIsOpen = false; // tracked separately so updateZoomLabels (called during
                          // initial load, before the panel DOM consts exist) can
                          // check it without a temporal-dead-zone crash

// groups points that are within thresholdPx of *any* other point in the same
// group (transitively) -- plain single-linkage clustering via union-find.
function clusterByProximity(pts, thresholdPx){
  const parent = pts.map((_,i)=>i);
  function find(i){ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; }
  function union(i,j){ const ri=find(i), rj=find(j); if(ri!==rj) parent[ri]=rj; }
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      if(pts[i].p.distanceTo(pts[j].p) < thresholdPx) union(i,j);
    }
  }
  const groups = new Map();
  pts.forEach((pt,i)=>{
    const r = find(i);
    if(!groups.has(r)) groups.set(r, []);
    groups.get(r).push(pt);
  });
  return Array.from(groups.values());
}

function updateZoomLabels(){
  zoomLabelsLayer.clearLayers();
  if (!labelsOn) return; // labels only ever show while the Labels toggle is on
  if (spiderfied) return; // spiderfy already prints its own labels
  if (panelIsOpen) return; // panel owns the screen -- don't relabel behind it
  if (map.getZoom() < LABEL_MIN_ZOOM) return;
  const visible = AGENCIES.filter(a=>currentMatchIds.has(a.id));
  const pts = visible.map(a=>({ a, p: map.latLngToContainerPoint(markers[a.id].getLatLng()) }));

  clusterByProximity(pts, LABEL_ISOLATION_PX).forEach(group=>{
    if (group.length === 1){
      // isolated pin -- plain label right beside the dot, same as always.
      const { a } = group[0];
      L.tooltip({ permanent:true, direction:'right', offset:[9,0], className:'zoom-label', interactive:false })
        .setLatLng(markers[a.id].getLatLng())
        .setContent(shortLabel(a.name))
        .addTo(zoomLabelsLayer);
      return;
    }
    // clustered pins -- rather than dropping their labels (the old
    // behavior), stack them in a small vertical list just past the
    // cluster and draw a thin leader line from each label back to its
    // actual pin, so every pin stays readable without moving or requiring
    // a click, however tightly the dots themselves overlap.
    group.sort((x,y)=> x.p.y - y.p.y);
    const anchorX = Math.max(...group.map(g=>g.p.x)) + LEADER_GAP_PX;
    const centerY = group.reduce((s,g)=>s+g.p.y,0) / group.length;
    const startY = centerY - (group.length-1)*LEADER_LINE_H_PX/2;
    group.forEach((g,i)=>{
      const labelLatLng = map.containerPointToLatLng(L.point(anchorX, startY + i*LEADER_LINE_H_PX));
      L.polyline([markers[g.a.id].getLatLng(), labelLatLng],
        { color:'#5e6a8c', weight:1, opacity:.7, dashArray:'2,3', interactive:false }).addTo(zoomLabelsLayer);
      L.tooltip({ permanent:true, direction:'right', offset:[3,0], className:'zoom-label', interactive:false })
        .setLatLng(labelLatLng)
        .setContent(shortLabel(g.a.name))
        .addTo(zoomLabelsLayer);
    });
  });
}
map.on('zoomend', updateZoomLabels);

/* ============================= SPIDERFY OVERLAPPING PINS ============================= */
/* When several agencies sit at (nearly) the same spot, clicking one fans them
   out into a small ring -- connected by thin dashed "legs" back to the shared
   origin -- so each becomes independently hoverable/clickable, instead of
   being stuck under whichever pin happens to render on top. Panning, zooming,
   or clicking empty space collapses them back to their true location. */
let spiderfied = null; // { ids:[...], originalLatLngs:Map(id->LatLng), legs:L.LayerGroup }
let spiderHoverBindings = []; // [{marker, over, out}] -- unbound on collapse

/* touch/no-hover devices (iPhone, iPad, most Android) can't fire :hover,
   so bindTooltip's mouseover trigger never fires there. On these devices
   we emulate hover with a "peek" tap: the first tap on a pin opens its
   name tooltip (same content a mouse hover would show); a second tap on
   that same, already-peeked pin opens the full detail panel. Tapping
   anywhere else closes the peek, same as moving the mouse away would. */
const noHover = window.matchMedia('(hover: none)').matches;

function closeAllTooltips(){
  Object.values(markers).forEach(m=>{ if(m.isTooltipOpen()) m.closeTooltip(); });
}

// short label used in the spiderfy fan -- prefers a trailing "(ACRONYM)"
// if the agency name has one, else falls back to a truncated name, so the
// fan stays readable instead of wrapping full agency names.
function shortLabel(name){
  const m = name.match(/\(([^)]+)\)\s*$/);
  if (m) return m[1];
  return name.length > 18 ? name.slice(0,16)+'…' : name;
}

function getOverlapCluster(latlng, thresholdPx){
  thresholdPx = thresholdPx || 16;
  const originPx = map.latLngToContainerPoint(latlng);
  const ids = [];
  Object.entries(markers).forEach(([id, m])=>{
    // only pins that pass the active filters can join a fan-out
    if (!currentMatchIds.has(id)) return;
    const p = map.latLngToContainerPoint(m.getLatLng());
    if (originPx.distanceTo(p) < thresholdPx) ids.push(id);
  });
  return ids;
}

function collapseSpiderfy(){
  if(!spiderfied) return;
  spiderHoverBindings.forEach(({marker, over, out})=>{ marker.off('mouseover', over); marker.off('mouseout', out); });
  spiderHoverBindings = [];
  spiderfied.originalLatLngs.forEach((latlng, id)=>{
    if(markers[id]) { markers[id].setLatLng(latlng); markers[id].closeTooltip(); }
  });
  map.removeLayer(spiderfied.legs);
  spiderfied = null;
  applyFilter(); // restores every pin's normal/dimmed look per the active filters
}

// while a cluster is fanned out, every *other* pin dims down so the fanned
// pins are the only ones drawing the eye -- independent of the category
// filter's own dimming, which is restored on collapse via applyFilter().
function highlightSpiderfied(ids){
  const idSet = new Set(ids);
  AGENCIES.forEach(a=>{
    const m = markers[a.id];
    // everything outside the fan dims, but pins that still match the
    // filters stay tappable; filtered-out pins stay inert
    m.setIcon(makeIcon(a.cats, !idSet.has(a.id), !currentMatchIds.has(a.id)));
    m.setZIndexOffset(idSet.has(a.id) ? 1000 : 0);
  });
}

// above this many pins in one cluster, auto-printed labels would overlap
// too much to read -- so the fan falls back to tap-to-peek for each pin.
const SPIDER_LABEL_MAX = 10;

function spiderfyCluster(ids, centerLatLng){
  collapseSpiderfy();
  zoomLabelsLayer.clearLayers();
  const n = ids.length;
  const showLabels = n <= SPIDER_LABEL_MAX;
  const radiusPx = (showLabels ? 30 : 24) + n*5;
  const centerPx = map.latLngToContainerPoint(centerLatLng);
  const legs = L.layerGroup().addTo(map);
  const originalLatLngs = new Map();
  ids.forEach((id, i)=>{
    const angle = (2*Math.PI*i/n) - Math.PI/2;
    const px = L.point(centerPx.x + radiusPx*Math.cos(angle), centerPx.y + radiusPx*Math.sin(angle));
    const newLatLng = map.containerPointToLatLng(px);
    originalLatLngs.set(id, markers[id].getLatLng());
    L.polyline([centerLatLng, newLatLng], {color:'#5e6a8c', weight:1, opacity:.7, dashArray:'2,3', interactive:false}).addTo(legs);
    markers[id].setLatLng(newLatLng);
    if (showLabels){
      // label sits just outside the pin, on whichever side keeps it from
      // reading back toward the cluster's center (left-half pins label to
      // the left, right-half to the right; near-vertical pins label above/below).
      const cos = Math.cos(angle), sin = Math.sin(angle);
      const dir = Math.abs(cos) < 0.35 ? (sin < 0 ? 'top' : 'bottom') : (cos >= 0 ? 'right' : 'left');
      const dirOffset = { top:[0,-9], bottom:[0,9], right:[8,0], left:[-8,0] }[dir];
      const label = L.tooltip({ permanent:true, direction:dir, offset:dirOffset, className:'spider-label' })
        .setLatLng(newLatLng)
        .setContent(shortLabel(AGENCY_BY_ID[id].name))
        .addTo(legs);

      // hovering the icon OR its label highlights both together, and shows
      // the same name/location/tags popup either way -- a mouse user
      // shouldn't have to land exactly on the tiny pin to get feedback.
      const marker = markers[id];
      const setHover = (on)=>{
        const pinEl = marker.getElement();
        if (pinEl) pinEl.classList.toggle('pin-hover', on);
        const labelEl = label.getElement();
        if (labelEl) labelEl.classList.toggle('spider-label-hover', on);
        if (on) marker.openTooltip(); else marker.closeTooltip();
      };
      const over = ()=> setHover(true);
      const out = ()=> setHover(false);
      marker.on('mouseover', over);
      marker.on('mouseout', out);
      spiderHoverBindings.push({ marker, over, out });
      const labelEl = label.getElement();
      if (labelEl){
        labelEl.addEventListener('mouseenter', over);
        labelEl.addEventListener('mouseleave', out);
        // clicking/tapping the label does exactly what clicking/tapping the
        // pin does -- peek-then-open on touch, open on mouse -- and must
        // stop the click from also reaching the map's own click-to-close.
        labelEl.addEventListener('click', (e)=>{
          e.stopPropagation();
          handleMarkerClick(AGENCY_BY_ID[id]);
        });
      }
    }
  });
  spiderfied = { ids, originalLatLngs, legs };
  highlightSpiderfied(ids);
}

// on touch devices, the first tap on a *distinguishable*, non-spiderfied
// pin just peeks its tooltip -- the hover-equivalent; tapping that same
// pin again opens the panel. (Spiderfied pins skip this -- see handleMarkerClick.)
function peekOrOpen(a){
  if (noHover && !markers[a.id].isTooltipOpen()) {
    closeAllTooltips();
    markers[a.id].openTooltip();
    return true;
  }
  return false;
}

// some embedded mobile browsers (e.g. in-app WebViews) fire more than one
// 'click' event for a single physical tap. Debounce so a duplicate/ghost
// click arriving a beat later can't re-enter this function and race the
// spiderfy/panel state (e.g. re-spiderfying right after a click that just
// opened the panel and collapsed it).
let lastMarkerClickAt = 0;
function handleMarkerClick(a){
  const now = Date.now();
  if (now - lastMarkerClickAt < 250) return;
  lastMarkerClickAt = now;
  // filtered-out pins are display-only
  if (!currentMatchIds.has(a.id)) return;
  if (spiderfied && spiderfied.ids.includes(a.id)) {
    // Leaflet auto-opens a marker's bound (non-permanent) tooltip on click,
    // independently of this handler -- undo it here since we're opening
    // the detail panel instead, not showing a floating name tooltip.
    markers[a.id].closeTooltip();
    // the fan-out itself (first tap on a grouped icon) never shows a popup --
    // it just reveals the individual icons and labels. Tapping one of those
    // individual spiderfied icons is what opens its detail panel; collapse
    // the fan first so its legs/labels don't linger under the open panel.
    collapseSpiderfy();
    openPanel(a);
    return;
  }
  const clusterIds = getOverlapCluster(markers[a.id].getLatLng());
  if (clusterIds.length > 1) {
    // same tooltip defeat as above -- the fan-out should show only icons
    // and labels, not a floating name tooltip for whichever pin was tapped.
    markers[a.id].closeTooltip();
    spiderfyCluster(clusterIds, markers[a.id].getLatLng());
    return;
  }
  if (peekOrOpen(a)) return;
  collapseSpiderfy();
  openPanel(a);
}

map.on('movestart zoomstart', collapseSpiderfy);

function applyFilter(){
  let visibleCount = 0;
  currentMatchIds = new Set();
  AGENCIES.forEach(a=>{
    const catMatch = activeCats.size===0 || a.cats.some(c=>activeCats.has(c));
    const match = catMatch;
    const m = markers[a.id];
    m.setIcon(makeIcon(a.cats, !match));
    m.setZIndexOffset(match?1000:0);
    // only matching (non-dimmed) pins should respond to hover; unbind the
    // tooltip entirely for dimmed ones so no info bubble appears for them
    if (match && !m.getTooltip()) {
      m.bindTooltip(tooltipContent[a.id], { direction:'top', offset:[0,-10], className:'pin-tip', opacity:1 });
    } else if (!match && m.getTooltip()) {
      m.unbindTooltip();
    }
    if(match) { visibleCount++; currentMatchIds.add(a.id); }
  });
  document.getElementById('count').textContent = `${visibleCount} / ${AGENCIES.length} agencies`;
  renderActiveFilters();
  updateZoomLabels();
}
applyFilter();

/* ============================= DETAIL PANEL ============================= */
const panel = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelLoc = document.getElementById('panel-loc');
const panelCats = document.getElementById('panel-cats');
const panelBody = document.getElementById('panel-body');
const emptyHint = document.getElementById('empty-hint');
const backdrop = document.getElementById('backdrop');

function openPanel(a){
  // belt-and-braces: whatever path got us here, the panel should never be
  // sharing the screen with a fanned-out cluster or the always-on zoom
  // labels -- clear both unconditionally before drawing panel content, and
  // again one frame later in case anything re-adds them asynchronously.
  collapseSpiderfy();
  zoomLabelsLayer.clearLayers();
  requestAnimationFrame(()=>{ collapseSpiderfy(); zoomLabelsLayer.clearLayers(); });

  panelName.textContent = a.name;
  panelLoc.textContent = a.city.toUpperCase();
  panelCats.innerHTML = a.cats.map(k=>`<span class="cat-tag" style="background:${CATS[k].hex}">${CATS[k].label}</span>`).join('');

  panelBody.innerHTML = '';
  const countEl = document.createElement('div');
  countEl.className = 'proj-count';
  countEl.textContent = `${a.projects.length} PROJECT${a.projects.length>1?'S':''}`;
  panelBody.appendChild(countEl);

  a.projects.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    const primeLine = (p.prime && p.prime.length)
      ? `<div class="ptag-prime">Teamed with: ${p.prime.join(', ')}</div>` : '';
    card.innerHTML = `
      <h3>${p.title}</h3>
      <div class="card-tags">${p.tags.map(t=>`<span class="ptag">${t}</span>`).join('')}</div>
      ${primeLine}
      <p>${p.summary}</p>
    `;
    panelBody.appendChild(card);
  });

  panel.classList.add('open');
  backdrop.classList.add('open');
  emptyHint.style.display = 'none';
  panelIsOpen = true;
  map.stop();
  map.flyTo([a.lat, a.lng], Math.max(map.getZoom(), 6), { duration:0.6 });
}

function closePanel(){
  panel.classList.remove('open');
  backdrop.classList.remove('open');
  emptyHint.style.display = '';
  panelIsOpen = false;
  map.stop();
  map.flyTo(DEFAULT_VIEW.center, DEFAULT_VIEW.zoom, { duration:0.6 });
  updateZoomLabels();
}

document.getElementById('panel-close').onclick = closePanel;
backdrop.addEventListener('click', closePanel);
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePanel(); });

/* click on empty map area closes panel */
map.on('click', ()=>{ closePanel(); collapseSpiderfy(); closeAllTooltips(); });

// last-resort invariant enforcer: no matter which code path might leave the
// fan and the open panel coexisting (we've tried to catch every one, but
// this guarantees it regardless), check a few times a second and force a
// collapse if it ever happens. Cheap no-op the rest of the time.
setInterval(()=>{ if (panelIsOpen && spiderfied) collapseSpiderfy(); }, 150);

</script>
</body>
